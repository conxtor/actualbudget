apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    kustomize.toolkit.fluxcd.io/name: actualbudget-actual-server
    kustomize.toolkit.fluxcd.io/namespace: flux-system
  name: actual-server
  namespace: actualbudget
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: actual-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-server
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - node
        - app.js
        command:
        - /usr/bin/tini
        - -g
        - --
        envFrom:
        - secretRef:
            name: actual-server-env
        image: actualbudget/actual-server@sha256:e18b7fbfec6157a368fad4146563f397502e9da70a120aeaeac63b4977405d1c
        imagePullPolicy: IfNotPresent
        name: actual-server
        ports:
        - containerPort: 5006
          name: p5006-tcp
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - node scripts/health-check.js
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - node scripts/health-check.js
          failureThreshold: 180
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: v-79d0193de082742c
        - mountPath: /dev/shm
          name: shm
        workingDir: /app
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: v-79d0193de082742c
        persistentVolumeClaim:
          claimName: v-79d0193de082742c
      - emptyDir:
          medium: Memory
          sizeLimit: '67108864'
        name: shm
---
apiVersion: v1
kind: Service
metadata:
  labels:
    kustomize.toolkit.fluxcd.io/name: actualbudget-actual-server
    kustomize.toolkit.fluxcd.io/namespace: flux-system
  name: actual-server
  namespace: actualbudget
spec:
  clusterIP: 10.43.237.147
  clusterIPs:
  - 10.43.237.147
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: p5006-tcp
    port: 5006
    protocol: TCP
    targetPort: 5006
  selector:
    app.kubernetes.io/name: actual-server
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    kustomize.toolkit.fluxcd.io/name: actualbudget-actual-server
    kustomize.toolkit.fluxcd.io/namespace: flux-system
  name: actual-server-actualbudget
  namespace: actualbudget
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`actualbudget.conxtor.com`)
    services:
    - name: actual-server
      port: 5006
  tls:
    certResolver: acmeresolver
